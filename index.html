<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funfair Order - Order Your Snacks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🎪 Funfair Snacks</h1>
      <p class="subtitle">Order your favorite snacks and enjoy the funfair!</p>
    </header>

    <div class="order-card">
      <form id="orderForm">
        <div class="form-group">
          <label for="name">👤 Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />
        </div>

        <div class="form-group">
          <label>🍽️ Choose Your Snacks</label>
          <div class="menu-grid" id="menuGrid">
            <!-- Menu items will be loaded here from backend -->
          </div>
        </div>

        <div class="total-section">
          <div id="totalPrice">Total: ₹0</div>
          <div class="selected-items" id="selectedItems"></div>
        </div>

        <button type="submit" class="btn-order">
          <span class="btn-text">🎉 Place Order</span>
          <div class="btn-loading">
            <div class="spinner"></div>
            Processing...
          </div>
        </button>
      </form>

      <div id="result" class="result"></div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2025 Aashay Vaidya. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
