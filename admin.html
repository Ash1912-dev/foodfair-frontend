<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - Funfair Orders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- 🔐 Admin Login Section -->
    <div id="loginSection">
      <h2>🔐 Admin Login</h2>
      <form id="loginForm">
        <input type="text" id="adminUser" placeholder="Username" required /><br />
        <input type="password" id="adminPass" placeholder="Password" required /><br />
        <button type="submit">Login</button>
      </form>
    </div>

    <!-- ✅ Actual Admin Panel -->
    <div id="adminPanel" style="display: none;">
      <header class="header">
        <h1>⚙️ ADMIN CONTROL CENTER</h1>
        <p class="subtitle">MANAGE ALL ORDERS</p>
        <div class="admin-actions">
          <button id="refreshBtn" class="btn-refresh">🔄 REFRESH ORDERS</button>
          <label>
            <input type="checkbox" id="toggleOrder" />
            <span>🛒 Accepting Orders</span>
          </label>
          <button id="clearOrdersBtn" class="btn-clear">🗑 CLEAR ALL ORDERS</button>
          <button id="logoutBtn">🚪 Logout</button>
          <button id="exportReportBtn">📄 Export Daily Report</button>


          <div class="stats">
            <div class="stat-item">
              <span class="stat-number" id="totalOrders">0</span>
              <span class="stat-label">TOTAL ORDERS</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="pendingOrders">0</span>
              <span class="stat-label">PENDING</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="completedOrders">0</span>
              <span class="stat-label">COMPLETED</span>
            </div>
          </div>
        </div>
      </header>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">ALL ORDERS</button>
        <button class="filter-btn" data-filter="pending">PENDING</button>
        <button class="filter-btn" data-filter="served">SERVED</button>
        <button class="filter-btn" data-filter="paid">PAID</button>
        <button class="filter-btn" data-filter="closed">CLOSED</button>
        

      </div>

      <div id="orders" class="orders-container">
        <div class="loading-spinner">
          <div class="spinner-large"></div>
          <p>LOADING ORDERS...</p>
        </div>
      </div>

      <div id="reportSection" style="display: none;">
        <h3>📊 Daily Report</h3>
        <div id="reportData"></div>
        <button onclick="exportReportToExcel()">⬇ Export to Excel</button>
      </div>


      <!-- 🍽️ Menu Management Section -->
      <div class="menu-admin-panel">
        <h2>🍽️ Manage Menu</h2>
        <form id="menuForm">
          <input type="text" id="menuName" placeholder="Item Name" required />
          <input type="text" id="menuEmoji" placeholder="Pic" required />
          <input type="text" id="menuDescription" placeholder="Description" />
          <input type="number" id="menuPrice" placeholder="Price" required />
          <button type="submit">Add / Update Item</button>
        </form>

        <div id="menuList" class="menu-list"></div>
      </div>

    </div>
  </div>

  <footer class="footer">
    <p>© 2025 Aashay Vaidya. All Rights Reserved. | <a href="index.html">← BACK TO CUSTOMER PAGE</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
